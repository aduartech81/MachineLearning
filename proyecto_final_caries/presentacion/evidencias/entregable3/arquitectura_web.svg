<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 210" role="img" aria-label="Separación entre entrenamiento y aplicación pública"><rect width="1100" height="210" fill="#f3f8f8" rx="16"/><text x="24" y="34" font-family="Arial" font-size="22" fill="#173747" font-weight="bold">Separación entre entrenamiento y aplicación pública</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#147c86"/></marker></defs><rect x="20" y="75" width="235" height="88" rx="12" fill="white" stroke="#bfd5dc"/><text x="33" y="100" font-family="Arial" font-size="17" font-weight="bold" fill="#0e7882">Fuera del servidor web</text><text x="33" y="124" font-family="Arial" font-size="14" fill="#173747">Selección y ajuste final</text><text x="33" y="144" font-family="Arial" font-size="14" fill="#173747">Guardar modelos y metadatos</text><path d="M258,119 H281" stroke="#147c86" stroke-width="2" marker-end="url(#arrow)"/><rect x="288" y="75" width="235" height="88" rx="12" fill="white" stroke="#bfd5dc"/><text x="301" y="100" font-family="Arial" font-size="17" font-weight="bold" fill="#0e7882">Repositorio</text><text x="301" y="124" font-family="Arial" font-size="14" fill="#173747">Código y artefactos</text><text x="301" y="144" font-family="Arial" font-size="14" fill="#173747">Versiones y hashes verificables</text><path d="M526,119 H549" stroke="#147c86" stroke-width="2" marker-end="url(#arrow)"/><rect x="556" y="75" width="235" height="88" rx="12" fill="white" stroke="#bfd5dc"/><text x="569" y="100" font-family="Arial" font-size="17" font-weight="bold" fill="#0e7882">Render + Dash</text><text x="569" y="124" font-family="Arial" font-size="14" fill="#173747">Carga de modelos guardados</text><text x="569" y="144" font-family="Arial" font-size="14" fill="#173747">Validación de las entradas</text><path d="M794,119 H817" stroke="#147c86" stroke-width="2" marker-end="url(#arrow)"/><rect x="824" y="75" width="235" height="88" rx="12" fill="white" stroke="#bfd5dc"/><text x="837" y="100" font-family="Arial" font-size="17" font-weight="bold" fill="#0e7882">Persona usuaria</text><text x="837" y="124" font-family="Arial" font-size="14" fill="#173747">Exploración y predicción</text><text x="837" y="144" font-family="Arial" font-size="14" fill="#173747">Sin reentrenamiento en línea</text><text x="24" y="193" font-family="Arial" font-size="13" fill="#4b6875">El libro fechado conserva la entrega anterior; el portal presenta el estado actual del proyecto.</text></svg>